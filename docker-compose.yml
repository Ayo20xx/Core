services:
  db:
    image: postgres:16
    container_name: core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: core_user
      POSTGRES_PASSWORD: core_dev_password
      POSTGRES_DB: core_db
    ports:
      - "5442:5432"
    volumes:
      - core_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_user -d core_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  core_postgres_data:
